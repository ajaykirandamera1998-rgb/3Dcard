<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>90's MACHINE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- A-Frame + MindAR -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #fff;
      }

      body {
        position: relative;
      }

      /* AR container: full screen */
      #ar-container {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        z-index: 1;
      }

      /* Ensure A-Frame scene and its video/canvas are full screen */
      #ar-scene {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        display: block !important;
        z-index: 1;
      }

      #ar-scene video {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        object-fit: cover !important;
        z-index: 0 !important;
        display: block !important;
      }

      #ar-scene canvas {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 2 !important;
        pointer-events: none;
      }

      /* UI layers above AR */
      #ui-layer {
        position: relative;
        z-index: 10;
        pointer-events: none; /* let touches pass through where no buttons */
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      #ui-layer * {
        pointer-events: auto;
      }

      /* Start screen */
      #start-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 20;
        text-align: center;
        padding: 24px;
      }

      #start-screen h1 {
        font-size: 28px;
        margin: 0 0 8px 0;
      }

      #start-screen p {
        font-size: 14px;
        margin: 4px 0;
        opacity: 0.9;
      }

      #start-button {
        margin-top: 20px;
        padding: 12px 24px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: #6c5ce7;
        color: #fff;
        cursor: pointer;
      }

      #start-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* Top bar: title + target hint */
      #top-bar {
        padding: 12px 16px;
        background: linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0));
      }

      #top-bar h1 {
        font-size: 20px;
        margin: 0;
      }

      #top-bar p {
        font-size: 12px;
        margin: 4px 0 0 0;
        opacity: 0.8;
      }

      /* Game panel */
      #game-panel {
        padding: 12px 16px 80px;
        background: linear-gradient(0deg, rgba(0,0,0,0.8), rgba(0,0,0,0));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      #score-row {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 16px;
        font-weight: 600;
      }

      #coin-controls {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 100%;
      }

      #choice-row {
        display: flex;
        gap: 12px;
      }

      .choice-btn {
        padding: 8px 14px;
        border: 1px solid #fff;
        border-radius: 6px;
        background: transparent;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }

      .choice-btn.active {
        background: #fff;
        color: #000;
      }

      #flip-btn {
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #00b894;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }

      #flip-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #result-text {
        font-size: 14px;
        min-height: 18px;
        text-align: center;
      }

      /* Video panel */
      #video-panel {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        background: rgba(0,0,0,0.9);
        z-index: 30;
      }

      #video-panel.active {
        display: flex;
      }

      #video-container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #ar-video {
        max-width: 100%;
        max-height: 80vh;
        border-radius: 8px;
      }

      #video-controls {
        padding: 12px 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      #close-video-btn {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        background: #d63031;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }

      #unmute-btn {
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        background: #0984e3;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <!-- AR Scene (MindAR + A-Frame) -->
    <div id="ar-container">
      <a-scene
        id="ar-scene"
        mindar-image="
          imageTargetSrc: ./targets.mind;
          autoStart: false;
          uiScanning: no;
          uiLoading: no;
          uiError: no;
        "
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
      >
        <a-camera
          position="0 0 0"
          look-controls="enabled: false"
          cursor="fuse: false"
          raycaster="objects: .clickable"
        ></a-camera>

        <!-- TV target: targetIndex 0 -->
        <a-entity id="tv-target" mindar-image-target="targetIndex: 0">
          <!-- Example: simple 3D object on TV target -->
          <a-box
            position="0 0 0"
            rotation="0 0 0"
            scale="0.5 0.5 0.5"
            color="#6c5ce7"
            opacity="0.9"
          ></a-box>
        </a-entity>

        <!-- Coin target: targetIndex 1 -->
        <a-entity id="coin-target" mindar-image-target="targetIndex: 1">
          <!-- Example: simple 3D object on Coin target -->
          <a-sphere
            position="0 0 0"
            radius="0.25"
            color="#00b894"
            opacity="0.9"
          ></a-sphere>
        </a-entity>
      </a-scene>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
      <!-- Top bar -->
      <div id="top-bar">
        <h1>90's MACHINE</h1>
        <p>Touch the Past, Feel the Memory</p>
        <p style="margin-top: 6px; font-size: 12px; opacity: 0.7">
          Point camera at TV or Coin, then tap “Tap to Begin”.
        </p>
      </div>

      <!-- Start screen -->
      <div id="start-screen">
        <h1>90's MACHINE</h1>
        <p>Touch the Past, Feel the Memory</p>
        <p style="margin-top: 12px">
          Point your camera at a target image, then tap below to begin.
        </p>
        <button id="start-button">Tap to Begin</button>
        <p style="margin-top: 16px; font-size: 12px; opacity: 0.7">
          Point camera at TV or Coin
        </p>
      </div>

      <!-- Game panel -->
      <div id="game-panel">
        <div id="score-row">
          <span>YOU: <span id="user-score">0</span></span>
          <span>VS</span>
          <span>AI: <span id="ai-score">0</span></span>
        </div>

        <div id="coin-controls">
          <div id="choice-row">
            <button class="choice-btn" id="heads-btn">HEADS</button>
            <button class="choice-btn" id="tails-btn">TAILS</button>
          </div>
          <button id="flip-btn" disabled>FLIP COIN</button>
          <div id="result-text"></div>
        </div>

        <button id="open-video-btn" style="margin-top: 8px; padding: 10px 16px; border: none; border-radius: 8px; background: #fdcb6e; color: #000; font-size: 14px; cursor: pointer;">
          Play Video
        </button>
      </div>
    </div>

    <!-- Video Panel -->
    <div id="video-panel">
      <div id="video-container">
        <video id="ar-video" controls>
          <!-- Replace with your video URL -->
          <source src="./90s-cafe.mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
      <div id="video-controls">
        <button id="close-video-btn">Close</button>
        <button id="unmute-btn">Unmute</button>
      </div>
    </div>

    <script>
      // --- AR STARTUP ---
      const scene = document.querySelector("#ar-scene");
      const startButton = document.querySelector("#start-button");
      const startScreen = document.querySelector("#start-screen");

      startButton.addEventListener("click", async () => {
        try {
          startButton.disabled = true;
          startButton.textContent = "Starting camera...";

          const arSystem = scene.systems["mindar-image-system"];
          if (!arSystem) {
            throw new Error("MindAR image system was not found.");
          }

          await arSystem.start();

          // Hide start screen once camera is running
          startScreen.style.display = "none";

          // Extra safety: ensure video element is visible
          setTimeout(() => {
            const cameraVideo = document.querySelector("#ar-scene video");
            if (cameraVideo) {
              cameraVideo.style.display = "block";
              cameraVideo.style.visibility = "visible";
              cameraVideo.style.opacity = "1";
            }
          }, 500);
        } catch (error) {
          console.error("Unable to start AR:", error);
          startButton.disabled = false;
          startButton.textContent = "Tap to Begin";
          alert(
            "Camera could not start. Please allow camera permission and open this page using HTTPS or localhost."
          );
        }
      });

      // --- TARGET DEBUGGING (console logs) ---
      const tvTarget = document.querySelector("#tv-target");
      const coinTarget = document.querySelector("#coin-target");

      tvTarget.addEventListener("targetFound", () => {
        console.log("TV target found (targetIndex 0)");
      });
      tvTarget.addEventListener("targetLost", () => {
        console.log("TV target lost");
      });

      coinTarget.addEventListener("targetFound", () => {
        console.log("Coin target found (targetIndex 1)");
      });
      coinTarget.addEventListener("targetLost", () => {
        console.log("Coin target lost");
      });

      // --- COIN GAME LOGIC ---
      let userChoice = null; // "heads" or "tails"
      let userScore = 0;
      let aiScore = 0;

      const headsBtn = document.querySelector("#heads-btn");
      const tailsBtn = document.querySelector("#tails-btn");
      const flipBtn = document.querySelector("#flip-btn");
      const resultText = document.querySelector("#result-text");
      const userScoreEl = document.querySelector("#user-score");
      const aiScoreEl = document.querySelector("#ai-score");

      headsBtn.addEventListener("click", () => {
        userChoice = "heads";
        headsBtn.classList.add("active");
        tailsBtn.classList.remove("active");
        flipBtn.disabled = false;
        resultText.textContent = "You chose HEADS";
      });

      tailsBtn.addEventListener("click", () => {
        userChoice = "tails";
        tailsBtn.classList.add("active");
        headsBtn.classList.remove("active");
        flipBtn.disabled = false;
        resultText.textContent = "You chose TAILS";
      });

      flipBtn.addEventListener("click", () => {
        if (!userChoice) return;

        const outcomes = ["heads", "tails"];
        const result = outcomes[Math.floor(Math.random() * outcomes.length)];

        if (result === userChoice) {
          userScore++;
          resultText.textContent = `Result: ${result.toUpperCase()}. You win this round!`;
        } else {
          aiScore++;
          resultText.textContent = `Result: ${result.toUpperCase()}. AI wins this round.`;
        }

        userScoreEl.textContent = userScore;
        aiScoreEl.textContent = aiScore;

        flipBtn.disabled = true;
        headsBtn.classList.remove("active");
        tailsBtn.classList.remove("active");
        userChoice = null;
      });

      // --- VIDEO PANEL ---
      const videoPanel = document.querySelector("#video-panel");
      const arVideo = document.querySelector("#ar-video");
      const openVideoBtn = document.querySelector("#open-video-btn");
      const closeVideoBtn = document.querySelector("#close-video-btn");
      const unmuteBtn = document.querySelector("#unmute-btn");

      openVideoBtn.addEventListener("click", () => {
        videoPanel.classList.add("active");
        arVideo.currentTime = 0;
        arVideo.play().catch(() => {});
      });

      closeVideoBtn.addEventListener("click", () => {
        videoPanel.classList.remove("active");
        arVideo.pause();
      });

      unmuteBtn.addEventListener("click", () => {
        arVideo.muted = false;
      });

      // Ensure video starts muted (for autoplay policies)
      arVideo.muted = true;
    </script>
  </body>
</html>
